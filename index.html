<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דוח עסקים חשודים – ארנונה ירושלים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:#F5F7FA;color:#222;direction:rtl}
/* HEADER */
.header{background:#1F3864;color:#fff;padding:16px 24px}
.header h1{font-size:1.3rem;font-weight:700;margin-bottom:10px}
.header h1 span{font-size:1.1rem;opacity:.8}
.stats-bar{display:flex;gap:10px;flex-wrap:wrap}
.stat-badge{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.85rem;font-weight:600;cursor:pointer;transition:opacity .2s}
.stat-badge:hover{opacity:.85}
.stat-badge.all{background:#E8A020;color:#fff}
.stat-badge.high{background:#C00000;color:#fff}
.stat-badge.ok{background:#2E7D32;color:#fff}
.stat-badge.check{background:#005F8A;color:#fff}
.stat-badge .count{background:rgba(255,255,255,.3);border-radius:10px;padding:1px 7px;font-size:.8rem}
/* FILTERS */
.filters{background:#fff;padding:14px 24px;border-bottom:1px solid #dde3ed;display:flex;gap:12px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 6px rgba(0,0,0,.07)}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap input{width:100%;padding:8px 36px 8px 12px;border:1px solid #cdd5e0;border-radius:6px;font-family:'Heebo',sans-serif;font-size:.9rem;outline:none}
.search-wrap input:focus{border-color:#1F3864}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#999;font-size:1rem}
select{padding:8px 12px;border:1px solid #cdd5e0;border-radius:6px;font-family:'Heebo',sans-serif;font-size:.9rem;outline:none;background:#fff;cursor:pointer}
select:focus{border-color:#1F3864}
.toggle-group{display:flex;gap:6px;flex-wrap:wrap}
.toggle-btn{padding:7px 13px;border:2px solid transparent;border-radius:20px;font-family:'Heebo',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s}
.toggle-btn.t-all{background:#fff;border-color:#E8A020;color:#E8A020}
.toggle-btn.t-all.active{background:#E8A020;color:#fff}
.toggle-btn.t-high{background:#fff;border-color:#C00000;color:#C00000}
.toggle-btn.t-high.active{background:#FFE0E0;border-color:#C00000}
.toggle-btn.t-ok{background:#fff;border-color:#2E7D32;color:#2E7D32}
.toggle-btn.t-ok.active{background:#E8F5E9;border-color:#2E7D32}
.toggle-btn.t-check{background:#fff;border-color:#005F8A;color:#005F8A}
.toggle-btn.t-check.active{background:#D6F0FF;border-color:#005F8A}
/* TABLE */
.table-wrap{padding:16px 24px}
.result-count{font-size:.85rem;color:#555;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.export-btn{background:#E8A020;color:#fff;border:none;padding:7px 16px;border-radius:6px;font-family:'Heebo',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;transition:background .2s}
.export-btn:hover{background:#c98a18}
.tbl-container{overflow-x:auto;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;background:#fff;font-size:.87rem;min-width:700px}
thead{background:#1F3864;color:#fff;position:sticky;top:0}
thead th{padding:10px 12px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{background:#16305a}
thead th .sort-arrow{opacity:.5;font-size:.75rem;margin-right:3px}
thead th.sorted .sort-arrow{opacity:1}
tbody tr{border-bottom:1px solid #eef0f5;cursor:pointer;transition:filter .15s}
tbody tr:hover{filter:brightness(.96)}
tbody tr.row-high{background:#FFF5F5}
tbody tr.row-ok{background:#F5FBF5}
tbody tr.row-check{background:#F0F8FF}
td{padding:9px 12px;vertical-align:middle}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:.78rem;font-weight:600;white-space:nowrap}
.badge-high{background:#FFE0E0;color:#C00000}
.badge-ok{background:#E8F5E9;color:#2E7D32}
.badge-check{background:#D6F0FF;color:#005F8A}
.type-tag{background:#EEF2FF;color:#3949AB;padding:2px 8px;border-radius:10px;font-size:.78rem;white-space:nowrap}
.detail-btn{background:none;border:1px solid #1F3864;color:#1F3864;padding:4px 10px;border-radius:6px;font-family:'Heebo',sans-serif;font-size:.78rem;cursor:pointer;transition:all .15s;white-space:nowrap}
.detail-btn:hover{background:#1F3864;color:#fff}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:#fff;border-radius:10px;width:90%;max-width:560px;max-height:88vh;overflow-y:auto;direction:rtl}
.modal-header{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #eee}
.modal-header h2{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:8px}
.modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#666;line-height:1;padding:0 4px}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.modal-row{display:flex;gap:8px;align-items:flex-start}
.modal-icon{font-size:1rem;margin-top:1px;flex-shrink:0}
.modal-label{font-size:.8rem;color:#888;font-weight:500;white-space:nowrap}
.modal-val{font-size:.9rem;color:#222;line-height:1.5}
.modal-divider{border:none;border-top:1px solid #eee;margin:4px 0}
.alert-box{padding:10px 14px;border-radius:7px;font-size:.87rem;line-height:1.5}
.alert-high{background:#FFF0F0;border-right:4px solid #C00000;color:#7a0000}
.alert-ok{background:#F0FBF0;border-right:4px solid #2E7D32;color:#1b5e20}
.alert-check{background:#EEF8FF;border-right:4px solid #005F8A;color:#004060}
.owners-list{font-size:.82rem;color:#555;line-height:1.7;background:#F9FAFB;padding:8px 12px;border-radius:6px;max-height:120px;overflow-y:auto}
.src-link{color:#005F8A;font-size:.85rem;text-decoration:none}
.src-link:hover{text-decoration:underline}
@media(max-width:600px){
  .header h1{font-size:1.1rem}
  .filters{padding:10px 12px}
  .table-wrap{padding:10px 12px}
  .modal{width:96%;max-height:94vh}
}
</style>
</head>
<body>

<div class="header">
  <h1>🏛️ דוח עסקים חשודים – ארנונה ירושלים</h1>
  <div class="stats-bar" id="statsBar"></div>
</div>

<div class="filters">
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍  חיפוש לפי שם עסק או כתובת...">
  </div>
  <select id="typeFilter">
    <option value="">כל סוגי העסקים</option>
    <option value="מרפאת שיניים">🦷 מרפאת שיניים</option>
    <option value="משרד עורכי דין">⚖️ משרד עורכי דין</option>
    <option value="משרד רואי חשבון">📊 משרד רואי חשבון</option>
    <option value="מרפאה וטרינרית">🐾 מרפאה וטרינרית</option>
  </select>
  <div class="toggle-group" id="toggleGroup">
    <button class="toggle-btn t-all active" data-filter="all">● הכל</button>
    <button class="toggle-btn t-high" data-filter="גבוה">🔴 גבוה</button>
    <button class="toggle-btn t-ok" data-filter="לא חשוד">🟢 לא חשוד</button>
    <button class="toggle-btn t-check" data-filter="דרוש בדיקה">🔵 דרוש בדיקה</button>
  </div>
</div>

<div class="table-wrap">
  <div class="result-count">
    <span id="resultCount"></span>
    <button class="export-btn" onclick="exportCSV()">⬇️ ייצוא CSV</button>
  </div>
  <div class="tbl-container">
    <table id="mainTable">
      <thead>
        <tr>
          <th onclick="sortBy(0)" data-col="0"><span class="sort-arrow">▼</span> שם העסק</th>
          <th onclick="sortBy(1)" data-col="1"><span class="sort-arrow">▼</span> סוג</th>
          <th onclick="sortBy(2)" data-col="2"><span class="sort-arrow">▼</span> כתובת</th>
          <th onclick="sortBy(3)" data-col="3"><span class="sort-arrow">▼</span> יחידות</th>
          <th onclick="sortBy(4)" data-col="4"><span class="sort-arrow">▼</span> דירוג חשד</th>
          <th>פרטים</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

let filtered = [...DATA];
let sortCol = -1, sortDir = 1;
let activeFilter = 'all';

function ratingEmoji(r){return r==='גבוה'?'🔴':r==='לא חשוד'?'🟢':'🔵';}
function ratingClass(r){return r==='גבוה'?'row-high':r==='לא חשוד'?'row-ok':'row-check';}
function badgeClass(r){return r==='גבוה'?'badge-high':r==='לא חשוד'?'badge-ok':'badge-check';}
function typeEmoji(t){return t==='מרפאת שיניים'?'🦷':t==='משרד עורכי דין'?'⚖️':t==='משרד רואי חשבון'?'📊':'🐾';}

function buildStats(){
  const c={גבוה:0,'לא חשוד':0,'דרוש בדיקה':0};
  DATA.forEach(x=>c[x.r]++);
  const bar=document.getElementById('statsBar');
  bar.innerHTML=`
    <span class="stat-badge all" onclick="setFilter('all')">סה"כ <span class="count">${DATA.length}</span></span>
    <span class="stat-badge high" onclick="setFilter('גבוה')">🔴 חשד גבוה <span class="count">${c['גבוה']}</span></span>
    <span class="stat-badge ok" onclick="setFilter('לא חשוד')">🟢 לא חשוד <span class="count">${c['לא חשוד']}</span></span>
    <span class="stat-badge check" onclick="setFilter('דרוש בדיקה')">🔵 דרוש בדיקה <span class="count">${c['דרוש בדיקה']}</span></span>
  `;
}

function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.toggle-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.filter===f);
  });
  applyFilters();
}

function applyFilters(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const tp=document.getElementById('typeFilter').value;
  filtered=DATA.filter(row=>{
    if(activeFilter!=='all' && row.r!==activeFilter) return false;
    if(tp && row.t!==tp) return false;
    if(q && !row.n.toLowerCase().includes(q) && !row.a.toLowerCase().includes(q)) return false;
    return true;
  });
  if(sortCol>=0) doSort(false);
  render();
}

function render(){
  const tbody=document.getElementById('tableBody');
  if(!filtered.length){
    tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;padding:30px;color:#888;">לא נמצאו תוצאות</td></tr>`;
  } else {
    tbody.innerHTML=filtered.map((row,i)=>`
      <tr class="${ratingClass(row.r)}" onclick="openModal(${DATA.indexOf(row)})">
        <td><strong>${row.n}</strong></td>
        <td><span class="type-tag">${typeEmoji(row.t)} ${row.t}</span></td>
        <td>${row.a}</td>
        <td>${typeof row.d==='number'?row.d.toLocaleString('he-IL'):row.d}</td>
        <td><span class="badge ${badgeClass(row.r)}">${ratingEmoji(row.r)} ${row.r}</span></td>
        <td><button class="detail-btn" onclick="event.stopPropagation();openModal(${DATA.indexOf(row)})">📄 פרטים</button></td>
      </tr>`).join('');
  }
  document.getElementById('resultCount').textContent=`מציג ${filtered.length.toLocaleString('he-IL')} מתוך ${DATA.length.toLocaleString('he-IL')} עסקים`;
}

function sortBy(col){
  if(sortCol===col) sortDir*=-1; else {sortCol=col;sortDir=1;}
  document.querySelectorAll('thead th').forEach((th,i)=>{
    th.classList.toggle('sorted',i===col);
    const arr=th.querySelector('.sort-arrow');
    if(arr) arr.textContent=i===col?(sortDir===1?'▲':'▼'):'▼';
  });
  doSort(true);
}

function doSort(rerender){
  const keys=['n','t','a','d','r'];
  filtered.sort((a,b)=>{
    let va=a[keys[sortCol]], vb=b[keys[sortCol]];
    if(typeof va==='number'&&typeof vb==='number') return (va-vb)*sortDir;
    return String(va).localeCompare(String(vb),'he')*sortDir;
  });
  if(rerender) render();
}

function openModal(idx){
  const row=DATA[idx];
  const emo=ratingEmoji(row.r);
  const alertCls=row.r==='גבוה'?'alert-high':row.r==='לא חשוד'?'alert-ok':'alert-check';
  const content=row.r==='גבוה'?row.det:row.r==='לא חשוד'?row.nc:row.det;
  document.getElementById('modalTitle').innerHTML=`${emo} ${row.n}`;
  document.getElementById('modalBody').innerHTML=`
    <div class="modal-row"><span class="modal-icon">📍</span><div><div class="modal-label">כתובת</div><div class="modal-val">${row.a}${row.am&&row.am!==row.a?' <span style="color:#888;font-size:.8rem">(בעירייה: '+row.am+')</span>':''}</div></div></div>
    <div class="modal-row"><span class="modal-icon">🏷️</span><div><div class="modal-label">סוג עסק</div><div class="modal-val">${typeEmoji(row.t)} ${row.t}</div></div></div>
    <div class="modal-row"><span class="modal-icon">🏠</span><div><div class="modal-label">מספר יחידות בבניין</div><div class="modal-val">${typeof row.d==='number'?row.d.toLocaleString('he-IL')+' יחידות':row.d}</div></div></div>
    <hr class="modal-divider">
    <div class="modal-row"><span class="modal-icon">👤</span><div><div class="modal-label">בעלי נכסים</div><div class="owners-list">${row.o}</div></div></div>
    <hr class="modal-divider">
    <div class="alert-box ${alertCls}"><strong>${emo} ${row.r}:</strong> ${content||'—'}</div>
    ${row.url?`<div class="modal-row"><span class="modal-icon">🔗</span><div><div class="modal-label">מקור המידע</div><a class="src-link" href="${row.url}" target="_blank" rel="noopener">${row.url}</a></div></div>`:''}
  `;
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e){if(e.target===document.getElementById('modalOverlay')) closeModalDirect();}
function closeModalDirect(){document.getElementById('modalOverlay').classList.remove('open');}

function exportCSV(){
  const headers=['שם העסק','סוג העסק','כתובת','כתובת תואמת','מספר דירות','דירוג חשד','פירוט'];
  const rows=filtered.map(r=>[r.n,r.t,r.a,r.am,r.d,r.r,r.r==='לא חשוד'?r.nc:r.det].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv='\uFEFF'+[headers.join(','),...rows].join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download='דוח_ארנונה_'+new Date().toISOString().slice(0,10)+'.csv';
  a.click();
}

document.getElementById('searchInput').addEventListener('input',applyFilters);
document.getElementById('typeFilter').addEventListener('change',applyFilters);
document.querySelectorAll('.toggle-btn').forEach(b=>b.addEventListener('click',()=>setFilter(b.dataset.filter)));
document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModalDirect();});

buildStats();
applyFilters();
</script>
